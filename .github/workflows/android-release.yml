name: Android Release (AAB + APK, signed)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
              echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
              echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository keystore."
          else
            echo "::warning::Signing secrets are incomplete: using a temporary key. Updates will not install over the store-signed build."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/temp.jks" -alias temp -keyalg RSA -keysize 2048 -validity 10000 -storepass tempPass123 -keypass tempPass123 -dname "CN=Bitcoin Explorer"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/temp.jks"
              echo "KEYSTORE_PASSWORD=tempPass123"
              echo "KEY_ALIAS=temp"
              echo "KEY_PASSWORD=tempPass123"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-explorer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-explorer-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
