<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1a">
<title>Bitcoin Explorer</title>
<style>
:root{--ok:#35e0a1;--warn:#f7931a;--bad:#ff6b6b;--bg:#0d0f1a;--bg2:#161a2e;--card:#1a1f36;--card2:#222849;--text:#f1f3ff;--muted:#8d94b8;--line:#2b3157;--accent:#f7931a;--accent2:#ffb347;--in:#35e0a1;--out:#ff6b6b;--blue:#5b8cff;--violet:#a66bff;--glow:0 6px 24px rgba(247,147,26,.18)}
@media (prefers-color-scheme:light){:root:not([data-theme]){--ok:#0f9d6b;--warn:#d97706;--bad:#d93a3a;--bg:#f3f4fb;--bg2:#e9ebf8;--card:#fff;--card2:#f1f3fc;--text:#1a1d33;--muted:#6a7091;--line:#dfe2f2;--in:#0f9d6b;--out:#d93a3a;--glow:0 6px 20px rgba(247,147,26,.2)}}
:root[data-theme=light]{--ok:#0f9d6b;--warn:#d97706;--bad:#d93a3a;--bg:#f3f4fb;--bg2:#e9ebf8;--card:#fff;--card2:#f1f3fc;--text:#1a1d33;--muted:#6a7091;--line:#dfe2f2;--in:#0f9d6b;--out:#d93a3a;--glow:0 6px 20px rgba(247,147,26,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(166,107,255,.18),transparent 60%),radial-gradient(900px 500px at -10% 0,rgba(247,147,26,.16),transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
main{max-width:600px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffb347,#f7931a 60%,#e5740a);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;box-shadow:var(--glow)}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#ffb347,#f7931a,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--in);box-shadow:0 0 0 0 var(--in);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.search{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;min-width:0;padding:14px 16px;font-size:15px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(247,147,26,.2)}
button{font:inherit;border:0;border-radius:16px;background:linear-gradient(135deg,#ffb347,#f7931a);color:#1a1200;font-weight:700;padding:0 20px;cursor:pointer;box-shadow:var(--glow)}
button:active{transform:scale(.97)}
.back{background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 16px;margin-bottom:12px;font-weight:600;box-shadow:none}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;animation:up .4s both}
.fx{background:#0b0d18;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;animation:up .4s both}
.fx canvas{display:block;width:100%;height:230px}
.fxl{display:flex;gap:14px;align-items:center;padding:10px 14px;font-size:12px;color:#9aa0c3}
.fxl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fxl b{margin-left:auto;font-weight:600;color:#e6e8ff}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card h2,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
.hero{background:linear-gradient(135deg,#f7931a 0%,#e0457b 55%,#7b4dff 100%);border:0;color:#fff;box-shadow:0 10px 34px rgba(224,69,123,.3)}
.hero .lbl,.hero .muted{color:rgba(255,255,255,.8)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.price{text-align:right;font-weight:800;font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
.tag{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:#10131f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.tile{border-radius:16px;padding:12px 4px;color:#10131f}
.tile b{display:block;font-size:24px;font-weight:800}
.tile small{font-size:12px;font-weight:600;opacity:.85}
.tile i{display:block;font-style:normal;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.card>.row:first-of-type,.card>h2+.row{border-top:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all}
.in{color:var(--in);font-weight:700}.out{color:var(--out);font-weight:700}
.err{color:var(--out)}.muted{color:var(--muted);font-size:13px}
a.tx{color:inherit;text-decoration:none;display:block}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.scroll::-webkit-scrollbar{display:none}
.cube{flex:none;width:112px;border-radius:16px;padding:10px;color:#10131f;font-size:12px;font-weight:600;cursor:default;scroll-snap-align:start;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cube b{display:block;font-size:17px;font-weight:800;margin-bottom:2px}
.cube div{opacity:.85;line-height:1.5}
.blk{cursor:pointer;position:relative;overflow:hidden}
.blk:active{transform:scale(.97)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f7931a,#e0457b,#7b4dff)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:10px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
svg.chart{width:100%;height:110px;display:block}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
.shimmer{height:90px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.st{--c:var(--muted);display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st.ok{--c:var(--ok)}.st.wait{--c:var(--warn)}.st.bad{--c:var(--bad)}
.idrow{display:flex;align-items:flex-start;gap:6px;min-width:0}.idrow .mono{flex:1;min-width:0}
.cp{flex:none;background:transparent;border:0;box-shadow:none;color:var(--muted);padding:0;border-radius:8px;display:grid;place-items:center;min-width:30px;height:30px}
.cp.done{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.live .ib{width:36px;height:36px;border-radius:12px;margin-left:6px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.navrow .back{margin:0}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:none;border-radius:14px;flex:none}
.ib.on{color:var(--accent);border-color:var(--accent)}
.rt{display:flex;flex-direction:column;align-items:flex-end}.fi{color:var(--muted);font-size:12px;font-weight:500}
.more{width:100%;margin-top:10px;padding:12px;background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.seg{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;background:transparent;color:var(--muted);box-shadow:none;border-radius:11px;padding:10px 0;font-weight:600}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.grp{margin-bottom:16px}.grp .lbl{margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheetp{background:var(--card);width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:slide .25s}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.qr{width:230px;max-width:100%;margin:0 auto 14px;background:#fff;border-radius:16px;padding:10px}.qr svg{display:block;width:100%;height:auto}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(30px);opacity:0}}
#net{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--bad);color:#fff;text-align:center;font-size:13px;font-weight:600;z-index:30;transform:translateY(-110%);transition:transform .25s}
#net.on{transform:none}
#ptr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,0);opacity:0;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12px;z-index:15;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cp{min-width:36px;height:36px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;animation:fade .2s}
.dov.out{opacity:0;transition:opacity .18s}
.dpanel{position:absolute;left:0;top:0;bottom:0;width:min(82vw,320px);background:var(--card);padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.35);animation:dslide .22s}
.dov.out .dpanel{transform:translateX(-100%);transition:transform .18s}
@keyframes dslide{from{transform:translateX(-100%)}}
.dhd{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}.dhd b{font-size:17px;display:block}
.ditem{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;color:var(--text);box-shadow:none;border-radius:14px;padding:13px 12px;font-size:15px;font-weight:600}
.ditem svg{width:22px;height:22px}.ditem.on{background:var(--card2);color:var(--accent)}.ditem .dl{flex:1}
.dn{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--muted)}
.dsep{height:1px;background:var(--line);margin:8px 6px}
</style>


</head>
<body>
<main>
  <header><button id="menu" class="ib" type="button" aria-label="Menüyü aç" aria-haspopup="true"></button><div id="title" class="brand" role="button" tabindex="0" aria-label="Ana sayfa"><div class="logo">₿</div><h1>Bitcoin <span>Explorer</span></h1></div><div class="live"><i class="dot"></i><span id="upd">canlı</span></div></header>
  <div class="search">
    <input id="q" placeholder="Adres, işlem ID veya blok no" aria-label="Adres, işlem ID veya blok numarası" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button id="go" aria-label="Ara">Ara</button>
  </div>
  <div id="out"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="net" role="alert">Çevrimdışı. Bağlantı gelince otomatik yenilenecek.</div>
<div id="ptr" aria-hidden="true"></div>
<script src="vendor/qrcode.js"></script>
<script>
const API="https://mempool.space/api";
const $=id=>document.getElementById(id);
const out=$("out");
let view="home",lastTs=0;
function load(k,d){try{const v=localStorage.getItem("bx_"+k);return v?JSON.parse(v):d}catch(_){return d}}
function save(k,v){try{localStorage.setItem("bx_"+k,JSON.stringify(v))}catch(_){}}
const CFG=Object.assign({unit:"btc",theme:"system"},load("cfg",{}));
const FAV=load("fav",[]),REC=load("rec",[]),TRK=load("trk",[]);
let PRICE=null;// fiyat: mempool.space USD fiyatı, USD olarak gösterilir
function applyTheme(){const r=document.documentElement;CFG.theme==="system"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",CFG.theme)}
applyTheme();

const nf=(n,d=0)=>Number(n).toLocaleString("tr-TR",{maximumFractionDigits:d});
const btc=s=>CFG.unit==="sat"?nf(s):(s/1e8).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:8});
const U=()=>CFG.unit==="sat"?" sat":" BTC";
const ago=ts=>{const s=Math.max(0,Math.floor(Date.now()/1000-ts));if(s<60)return s+" sn önce";if(s<3600)return Math.floor(s/60)+" dk önce";if(s<86400)return Math.floor(s/3600)+" sa önce";return Math.floor(s/86400)+" gün önce"};
const when=t=>t.status&&t.status.confirmed?new Date(t.status.block_time*1000).toLocaleString("tr-TR"):"Onay bekliyor";
const short=(s,a=8,b=6)=>s.length>a+b+1?s.slice(0,a)+"…"+s.slice(-b):s;
// ücret -> renk (yeşil=ucuz, sarı, turuncu, kırmızı, mor=pahalı)
function fc(f){f=Math.max(1,f||1);const h=Math.max(-70,140-Math.log2(f)*26);return "hsl("+((h+360)%360)+",85%,62%)"}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function card(title,cls){const c=el("div","card"+(cls?" "+cls:""));if(title)c.appendChild(el("h2",null,title));return c}
function row(l,r,cls){const d=el("div","row");d.appendChild(el("span",null,l));d.appendChild(el("span",cls,r));return d}
function show(...n){out.innerHTML="";n.forEach(x=>out.appendChild(x))}
function msg(t,err){const c=card();c.appendChild(el("div",err?"err":"muted",t));return c}
function skeleton(){out.innerHTML="";for(let i=0;i<4;i++)out.appendChild(el("div","shimmer"))}
function backBtn(){const b=el("button","back","← Geri");b.onclick=()=>{history.state&&history.state.i>0?history.back():go("")};return b}
function withBack(...n){withNav([],...n)}
const IC='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const ICON_COPY=IC+'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',ICON_OK=IC+'<path d="M5 12l5 5 9-10"/></svg>';
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1600)}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch(_){const t=document.createElement("textarea");t.value=s;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(__){}t.remove()}}
function copyBtn(text,label){const b=el("button","cp");b.type="button";b.setAttribute("aria-label",label||"Kopyala");b.innerHTML=ICON_COPY;
  b.onclick=async e=>{e.preventDefault();e.stopPropagation();await copyText(text);b.innerHTML=ICON_OK;b.classList.add("done");toast("Kopyalandı");setTimeout(()=>{b.innerHTML=ICON_COPY;b.classList.remove("done")},1500)};return b}
function idrow(text,label){const d=el("div","idrow");d.appendChild(el("div","mono",text));d.appendChild(copyBtn(text,label));return d}
function badge(k,t){return el("span","st "+k,t)}
function addrRow(addr,val,cls,sign,label){const d=el("div","row"),l=el("div","idrow"),s=el("span","mono",addr||label||"(adres yok)");
  if(addr){s.style.cursor="pointer";s.setAttribute("role","link");s.tabIndex=0;s.onclick=()=>go("address/"+addr);s.onkeydown=e=>{if(e.key==="Enter")s.onclick()};l.appendChild(s);l.appendChild(copyBtn(addr,"Adresi kopyala"))}else l.appendChild(s);
  d.appendChild(l);if(val!=null)d.appendChild(el("span",cls,sign+btc(val)));return d}
function tag(text,color){const t=el("span","tag",text);t.style.background=color;return t}
const BS="https://blockstream.info/api";let ALT=false;
async function req(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
    const x=await r.text();try{return JSON.parse(x)}catch(_){return x.trim()}}
  finally{clearTimeout(t)}}
const soft=e=>!e.status||e.status>=500||e.status===429;
function alt(p){
  if(p==="/v1/blocks")return["/blocks",x=>x];
  if(p==="/v1/fees/recommended")return["/fee-estimates",x=>({fastestFee:Math.ceil(x[1]||x[2]||1),halfHourFee:Math.ceil(x[3]||1),hourFee:Math.ceil(x[6]||1)})];
  return /^\/(tx|address|block|blocks|mempool|block-height)(\/|$)/.test(p)?[p,x=>x]:null}
async function get(p){
  const ok=x=>{ALT=false;return x};
  try{return ok(await req(API+p))}catch(e){
    if(!soft(e))throw e;
    await new Promise(r=>setTimeout(r,500));
    try{return ok(await req(API+p))}catch(e2){
      const a=soft(e2)&&alt(p);
      if(a){try{const x=await req(BS+a[0]);ALT=true;return a[1](x)}catch(_){}}
      if(!navigator.onLine)$("net").classList.add("on");
      throw e2}}}
function errText(e){return e&&e.name==="AbortError"?"zaman aşımı":(e&&e.message)||"bilinmeyen hata"}
const PAL=["#f7931a","#5b8cff","#35e0a1","#a66bff","#ff6b6b","#ffd166","#4dd0e1","#8d94b8"];

function chart(points){
  const w=300,h=100,mn=Math.min(...points),mx=Math.max(...points),r=(mx-mn)||1;
  const xy=points.map((v,i)=>[i/(points.length-1)*w,8+(1-(v-mn)/r)*(h-16)]);
  const line=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 "+w+" "+h);s.setAttribute("preserveAspectRatio","none");s.setAttribute("class","chart");
  s.innerHTML='<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a66bff"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a66bff" stop-opacity=".45"/><stop offset="1" stop-color="#a66bff" stop-opacity="0"/></linearGradient></defs><path d="'+line+' L'+w+' '+h+' L0 '+h+'Z" fill="url(#g2)"/><path d="'+line+'" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  return s;
}

function hsl(h,s,l){h=(((h%360)+360)%360)/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return (l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255};return [f(0),f(8),f(4)]}
// İşlemi parçacıklarla çizer: girişler (sol) -> hub -> çıkışlar (sağ), üstte ücret
function txfx(t){
  const wrap=el("div","fx"),cv=el("canvas"),lg=el("div","fxl");
  cv.setAttribute("aria-label","İşlem akış görseli");wrap.appendChild(cv);wrap.appendChild(lg);
  [["Giriş","#ff6b6b"],["Çıkış","#35e0a1"],["Ücret","#f7931a"]].forEach(([n,c])=>{const s=el("span");const d=el("i");d.style.background=c;s.appendChild(d);s.appendChild(document.createTextNode(n));lg.appendChild(s)});
  lg.appendChild(el("b",null,t.vin.length+" giriş → "+t.vout.length+" çıkış"));
  let gl=null;try{gl=cv.getContext("webgl2",{antialias:false,alpha:false})}catch(e){}

const B32="qpzry9x8gf2tvdw0s3jn54khce6mua7l",B58="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function pm(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>>i)&1)c^=G[i]}return c>>>0}
function bech32ok(s){if(s!==s.toLowerCase()&&s!==s.toUpperCase())return false;s=s.toLowerCase();const i=s.lastIndexOf("1");
  if(i<1||i+7>s.length||s.length>90||s.slice(0,i)!=="bc")return false;const d=[];for(const ch of s.slice(i+1)){const v=B32.indexOf(ch);if(v<0)return false;d.push(v)}
  const hv=[3,3,0,2,3];const c=pm(hv.concat(d));return d[0]===0?c===1:c===0x2bc830a3}
async function b58ok(s){let n=0n;for(const ch of s){const v=B58.indexOf(ch);if(v<0)return false;n=n*58n+BigInt(v)}
  let hex=n.toString(16);if(hex.length%2)hex="0"+hex;const by=[];for(let i=0;i<hex.length;i+=2)by.push(parseInt(hex.slice(i,i+2),16));
  let z=0;while(z<s.length&&s[z]==="1")z++;const all=new Uint8Array(z+by.length);all.set(by,z);
  if(all.length!==25||(all[0]!==0&&all[0]!==5))return false;
  if(!(window.crypto&&crypto.subtle))return true;
  const h=async d=>new Uint8Array(await crypto.subtle.digest("SHA-256",d)),h2=await h(await h(all.slice(0,21)));
  return [0,1,2,3].every(i=>all[21+i]===h2[i])}
const validAddr=a=>/^bc1/i.test(a)?Promise.resolve(bech32ok(a)):b58ok(a);

      const hb=el("div","bar");const hi=el("i");hi.style.width=((b0.height-840000)/2100)+"%";hb.appendChild(hi);hv.appendChild(hb);

      lf.appendChild(el("div","mono",short(t.txid)));

function net(tx,addr){
  let v=0;
  tx.vout.forEach(o=>{if(o.scriptpubkey_address===addr)v+=o.value});
  tx.vin.forEach(i=>{if(i.prevout&&i.prevout.scriptpubkey_address===addr)v-=i.prevout.value});
  return v;
}
function txItem(tx,addr){
  const a=el("a","tx");a.href="#";
  a.onclick=e=>{e.preventDefault();go("tx/"+tx.txid)};
  const w=el("div"),top=el("div","row");
  if(addr){const n=net(tx,addr);top.appendChild(el("span",n>=0?"in":"out",(n>=0?"+":"−")+btc(n)+U()))}
  else top.appendChild(el("span",null,btc(tx.vout.reduce((s,o)=>s+o.value,0))+U()));
  top.appendChild(tx.status&&tx.status.confirmed?badge("ok","Onaylı"):badge("wait","Bekliyor"));
  w.appendChild(top);if(tx.status&&tx.status.confirmed)w.appendChild(el("div","muted",when(tx)));w.appendChild(el("div","mono",tx.txid));
  a.appendChild(w);return a;
}

async function tx(id){
  let t;
  try{t=await get("/tx/"+id)}catch(e){
    if(!/404/.test(e.message))throw e;
    const c=card("İşlem");c.appendChild(idrow(id,"İşlem ID'sini kopyala"));
    const r=el("div","row");r.appendChild(el("span",null,"Durum"));r.appendChild(badge("bad","Bulunamadı"));c.appendChild(r);
    c.appendChild(el("div","muted","Bu ID ağda görünmüyor. İşlem reddedilmiş, ağdan düşmüş ya da henüz yayılmamış olabilir."));
    withBack(c);return}
  await ensurePrice();pushRec("tx",id);
  const total=t.vout.reduce((s,o)=>s+o.value,0),rate=t.fee/(t.weight?t.weight/4:t.size);
  let st,rb=null;
  if(t.status.confirmed){const tip=await get("/blocks/tip/height").catch(()=>null);st=badge("ok",tip?"Onaylandı · "+nf(tip-t.status.block_height+1)+" onay":"Onaylandı")}
  else{const r=await get("/v1/tx/"+id+"/rbf").catch(()=>null);rb=r&&r.replacements&&r.replacements.tx&&r.replacements.tx.txid;st=rb?badge("bad","Değiştirildi (RBF)"):badge("wait","Onay bekliyor")}
  const c=card("İşlem");c.appendChild(idrow(id,"İşlem ID'sini kopyala"));
  const sr=el("div","row");sr.appendChild(el("span",null,"Durum"));sr.appendChild(st);c.appendChild(sr);
  if(rb){const x=row("Değiştiren işlem",short(rb),"mono");x.style.cursor="pointer";x.onclick=()=>go("tx/"+rb);c.appendChild(x)}
  if(t.status.confirmed){c.appendChild(row("Zaman",when(t)));const x=row("Blok","#"+nf(t.status.block_height),"in");x.style.cursor="pointer";x.onclick=()=>go("block/"+t.status.block_hash);c.appendChild(x)}
  c.appendChild(amtRow("Toplam çıkış",total,"" ));
  const fr=el("div","row");fr.appendChild(el("span",null,"Ücret"));
  const fv=el("span","rt"),fw=el("span");fw.appendChild(document.createTextNode(nf(t.fee)+" sat "));fw.appendChild(tag(rate.toFixed(1)+" sat/vB",fc(rate)));fv.appendChild(fw);
  const ff=fiat(t.fee);if(ff)fv.appendChild(el("small","fi","≈ "+ff));fr.appendChild(fv);c.appendChild(fr);
  c.appendChild(row("Giriş / çıkış",t.vin.length+" / "+t.vout.length));
  c.appendChild(row("Boyut",t.size+" bayt"));
  const ins=card("Girişler"),o=card("Çıkışlar");
  t.vin.slice(0,20).forEach(x=>ins.appendChild(addrRow(x.is_coinbase?null:x.prevout&&x.prevout.scriptpubkey_address,x.prevout?x.prevout.value:null,"out","−",x.is_coinbase?"Coinbase (yeni basılan)":null)));
  if(t.vin.length>20)ins.appendChild(el("div","muted","+"+(t.vin.length-20)+" giriş daha"));
  t.vout.slice(0,30).forEach(x=>o.appendChild(addrRow(x.scriptpubkey_address,x.value,"in","+")));
  if(t.vout.length>30)o.appendChild(el("div","muted","+"+(t.vout.length-30)+" çıkış daha"));
  const acts=[];if(!t.status.confirmed)acts.push(trackBtn(id));acts.push(favBtn("tx",id),shareBtn("Bitcoin işlemi",EX+"tx/"+id));
  withNav(acts,txfx(t),c,ins,o);
}

function go(p){closeSheet();closeDrawer();const same=p===""?(!location.hash||location.hash==="#/"):location.hash==="#/"+p;
  if(same){route();return}
  scrolls[idx]=window.scrollY;history.pushState({i:++idx},"",p===""?location.pathname+location.search:"#/"+p);route()}
async function route(){
  const my=++rid,parts=location.hash.slice(2).split("/"),k=parts[0],a=decodeURIComponent(parts.slice(1).join("/")),y=scrolls[idx]||0;
  try{
    if(k==="tx"){view="detail";$("q").value=a;skeleton();await tx(a)}
    else if(k==="address"){view="detail";$("q").value=a;skeleton();await address(a)}
    else if(k==="block"){await block(a)}
    else if(k==="favs"){$("q").value="";listPage("Favoriler",FAV,"Henüz favori yok. Adres, işlem veya blok sayfasında yıldıza dokun.")}
    else if(k==="tracked"){$("q").value="";listPage("Takip edilen işlemler",TRK.map(x=>({t:"tx",id:x.id,st:x.st})),"Takip edilen işlem yok. Bekleyen bir işlemin sayfasında zil simgesine dokun.",x=>x.st>0?badge("ok","Onaylı"):badge("wait","Bekliyor"))}

  }catch(e){if(my===rid)withBack(msg("Sonuç alınamadı ("+errText(e)+"). Adresi kontrol et veya biraz sonra tekrar dene.",true))}
  window.scrollTo(0,y);
}

async function search(){
  const q=$("q").value.trim();
  if(!q){go("");return}
  const bad=m=>{view="detail";withBack(msg(m,true))};
  if(/^[0-9a-fA-F]{64}$/.test(q))go("tx/"+q);
  else if(/^\d{1,7}$/.test(q)){view="detail";skeleton();
    try{go("block/"+await get("/block-height/"+q))}catch(e){bad(/404/.test(e.message)?"Bu yükseklikte blok yok.":"Blok alınamadı ("+errText(e)+").")}}
  else if(/^(bc1|BC1|[13])[a-zA-HJ-NP-Z0-9]{25,90}$/.test(q)){
    if(await validAddr(q))go("address/"+q);else bad("Adres sağlama toplamı (checksum) hatalı. Bir karakter yanlış yazılmış olabilir.")}
  else bad("Geçerli bir adres, 64 karakterlik işlem ID veya blok numarası gir.")
}
